<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Ambiente VR - Panorama</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
</head>

<body>

  <a-scene>
    <a-assets>
      <img id="panorama-quarto" src="image.png">
    </a-assets>

    <a-cylinder id="ambiente" src="#panorama-quarto" radius="50" height="40" side="double" open-ended="true"
      rotation="0 -90 0">
    </a-cylinder>

    <a-plane position="0 -15 0" rotation="-90 0 0" width="100" height="100" color="#222"></a-plane>
    <a-sky color="#111"></a-sky>

    <a-entity camera look-controls position="0 1.6 0"></a-entity>

  </a-scene>

</body>

</html>
